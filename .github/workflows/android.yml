name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses & Install Components
        run: |
          if command -v sdkmanager > /dev/null; then
            SDKM="sdkmanager"
          else
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/HyprConnect.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyprConnect-APK
          path: build-output/HyprConnect.apk
          retention-days: 14

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/HyprConnect.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        run: |
          echo "### 🚀 HyprConnect Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the compiled **HyprConnect.apk** from the **Artifacts** section at the top of this run." >> $GITHUB_STEP_SUMMARY